        <script>
        const mainVideo = document.getElementById("main-video");
        const items = document.querySelectorAll(".video-item");
        const videoMainContainer = document.querySelector(".video-main");

        // Load YouTube titles
        items.forEach(item => {
            const id = item.getAttribute("data-video");
            const titleEl = item.querySelector("p");

            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
            .then(res => res.json())
            .then(data => {
                titleEl.textContent = data.title;
            });
        });

        // Change video + fade animation + highlight
        items.forEach(item => {
            item.addEventListener("click", () => {
            const id = item.getAttribute("data-video");

            // Fade out
            videoMainContainer.classList.remove("fade-in");
            videoMainContainer.classList.add("fade-out");

            setTimeout(() => {
                // Change video
                mainVideo.src = `https://www.youtube.com/embed/${id}`;

                // Fade in
                videoMainContainer.classList.remove("fade-out");
                videoMainContainer.classList.add("fade-in");
            }, 300);

            // Active highlight
            items.forEach(i => i.classList.remove("active"));
            item.classList.add("active");
            });
        });

        // First video selected by default
        items[0].classList.add("active");
        </script>
