    <section>
        <div class="live-section">
        <!-- VIDEO AREA -->
            <div class="live-wrapper">
                <span id="liveBadge" class="live-badge">LIVE 🔴</span>
                <span id="offlineBadge" class="offline-badge">OFFLINE</span>

                <!-- COUNTDOWN -->
                <div id="countdown" class="countdown"></div>

                <!-- VIDEO IFRAME -->
                <iframe
                    src="https://www.youtube.com/embed/YOUR_LIVE_ID?autoplay=1"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>
            </div>

            <!-- LIVE CHAT -->
            <div class="chat-wrapper">
                <iframe
                src="https://www.youtube.com/live_chat?v=MLwu8ojmM90&embed_domain=localhost">
                </iframe>
            </div>
    </div>
    </section>
